    <text x="366" y="356" fill="#E6F3FF" font-size="17" font-weight="600">VNC</text>
    <circle cx="422" cy="350" r="2" fill="#6383A5"/>
    <text x="438" y="356" fill="#E6F3FF" font-size="17" font-weight="600">Moonlight</text>
    <text x="64" y="409" fill="#8DAAC9" font-size="13" letter-spacing="2">NATIVE EXPERIENCE · OPEN SOURCE</text>
