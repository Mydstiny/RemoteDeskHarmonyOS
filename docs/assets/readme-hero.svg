    <text x="64" y="231" fill="#DAE9FA" font-size="28" font-weight="400">Your workspace, within reach.</text>
    <text x="64" y="276" fill="#9EB8D5" font-size="18">Desktop. Terminal. Files. Streaming.</text>
    <path d="M64 314H608" stroke="#36516F"/>
    <text x="64" y="356" fill="#E6F3FF" font-size="17" font-weight="600">RDP</text>
    <circle cx="117" cy="350" r="2" fill="#6383A5"/>
    <text x="133" y="356" fill="#E6F3FF" font-size="17" font-weight="600">RustDesk</text>
    <circle cx="225" cy="350" r="2" fill="#6383A5"/>
    <text x="241" y="356" fill="#E6F3FF" font-size="17" font-weight="600">SSH / SFTP</text>
