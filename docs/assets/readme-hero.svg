<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RemoteDesk — Your workspace, within reach.</title>
  <desc id="desc">HarmonyOS NEXT remote connections: RDP, RustDesk, SSH / SFTP, VNC and Moonlight. A conceptual connection diagram, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#0A1830"/><stop offset="1" stop-color="#102E55"/></linearGradient>
    <linearGradient id="blue" x1="760" y1="100" x2="1130" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#6BD7FF"/><stop offset="1" stop-color="#4E87FF"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#328DFF" stop-opacity=".2"/><stop offset="1" stop-color="#328DFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#94C9FF" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="24" fill="url(#grid)"/>
  <ellipse cx="980" cy="230" rx="390" ry="290" fill="url(#glow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
