version = 1

[[annotations]]
path = ["AppScope/**", "entry/src/**", "rustdesk_ffi/src/**", "scripts/**", "docs/**", "*.json5", "*.ts", "*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Li Jiong and contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "entry/src/main/resources/base/media/icon_moonlight.svg"
precedence = "override"
SPDX-FileCopyrightText = "Moonlight Game Streaming Project contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["freerdp/**", "patches/freerdp-ohos/**", "patches/libfido2-ohos/**", "libs/**", "rustdesk_vendor/**", "LICENSES/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Upstream authors; see THIRD_PARTY_NOTICES.md"
SPDX-License-Identifier = "LicenseRef-ThirdParty"

[[annotations]]
path = "server/pro-entitlement/agc/pkix/licenses/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Upstream authors; see included copyright notices and the separate PKIX SBOM"
SPDX-License-Identifier = "LicenseRef-ThirdParty"

[[annotations]]
path = "entry/src/main/resources/rawfile/ssh-terminal/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Authors of the bundled OFL monospace fonts; see docs/compliance/SSH_TERMINAL_FONTS_PROVENANCE.md and the bundled *-LICENSE.txt files"
SPDX-License-Identifier = "OFL-1.1"
